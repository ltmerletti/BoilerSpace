name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOILERSPACE_FIXTURES_DIR: .verify-tmp/Brightspace-Bar/session-capture/tests/fixtures
  TZ: America/Indiana/Indianapolis

jobs:
  lint:
    name: JavaScript and CSS lint (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public API fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidChen-006/Brightspace-Bar
          ref: 78290ad6d6a7a30ce381042bbd1572c41fdf15ef
          path: .verify-tmp/Brightspace-Bar
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  release:
    name: Firefox release package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public API fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidChen-006/Brightspace-Bar
          ref: 78290ad6d6a7a30ce381042bbd1572c41fdf15ef
          path: .verify-tmp/Brightspace-Bar
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run lint:firefox
      - name: Install Firefox system dependencies
        run: npx playwright install-deps firefox
      - name: Install official Firefox
        run: npx --no-install @puppeteer/browsers install firefox@stable --path .verify-tmp/browsers
      - name: Test the unmodified Firefox release package
        run: xvfb-run --auto-servernum node scripts/verify-release-firefox.mjs
        env:
          VERIFY_OUT: .verify-tmp/artifacts/release-firefox
      - name: Save unsigned packages, source and validator report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-v1-packages
          path: |
            dist/*.zip
            dist/*.json
            .verify-tmp/artifacts/release-firefox/
          include-hidden-files: true
          retention-days: 14

  browser:
    name: Browser tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, chat-streaming, chat-narration, data-lifecycle, syllabi, discussions, discussion-recovery, gradescope, discussion-search-chromium, discussion-search-firefox]
        include:
          - suite: ui
            script: scripts/verify.mjs
          - suite: chat-streaming
            script: scripts/verify-chat-streaming.mjs
          - suite: ask-updates
            script: scripts/verify-ask-updates.mjs
          - suite: chat-narration
            script: scripts/verify-chat-narration.mjs
          - suite: data-lifecycle
            script: scripts/verify-data-lifecycle.mjs
          - suite: syllabi
            script: scripts/verify-syllabi.mjs
          - suite: discussions
            script: scripts/verify-discussions.mjs
          - suite: gradescope
            script: scripts/verify-gradescope.mjs
          - suite: discussion-recovery
            script: scripts/verify-discussion-recovery.mjs
          - suite: discussion-search-chromium
            script: scripts/verify-discussion-search.mjs
            browser: chromium
          - suite: discussion-search-firefox
            script: scripts/verify-discussion-search.mjs
            browser: firefox
    env:
      VERIFY_OUT: .verify-tmp/artifacts/${{ matrix.suite }}
      VERIFY_BROWSER: ${{ matrix.browser || 'chromium' }}
      VERIFY_EXTENSION: dist/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public API fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidChen-006/Brightspace-Bar
          ref: 78290ad6d6a7a30ce381042bbd1572c41fdf15ef
          path: .verify-tmp/Brightspace-Bar
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "$VERIFY_BROWSER"
      - name: Run isolated extension checks
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' node "$VERIFY_SCRIPT" ./node_modules/playwright/index.mjs
        env:
          VERIFY_SCRIPT: ${{ matrix.script }}
      - name: Save fixture-test screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.suite }}
          path: .verify-tmp/artifacts/${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
