<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course document · BoilerSpace</title>
  <link rel="stylesheet" href="document.css">
  <script type="module" src="document.js"></script>
</head>
<body>
  <header>
    <div><span class="brand">BoilerSpace</span><h1 id="title">Course document</h1></div>
    <nav aria-label="Document pages">
      <button id="previous" type="button" disabled>Previous</button>
      <label>Page <input id="page" type="number" min="1" value="1" disabled aria-label="Page number"></label>
      <span id="total"></span>
      <button id="next" type="button" disabled>Next</button>
      <button id="original" type="button" hidden>Show original PDF</button>
    </nav>
  </header>
  <main>
    <p id="status" role="status">Opening the cited page…</p>
    <canvas id="pdf-page" hidden aria-label="Original PDF page"></canvas>
    <details id="text-details" open>
      <summary>Saved page text</summary>
      <pre id="page-text"></pre>
    </details>
  </main>
</body>
</html>
